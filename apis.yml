aid: videoverse
name: VideoVerse
description: >-
  VideoVerse is an AI video technology company founded in 2016 with offices in the United States,
  Europe and India, whose flagship SaaS platform Magnifi automatically detects key moments in live
  and archival footage and turns them into broadcast-ready highlights, vertical cuts, multilingual
  captions and enriched metadata for sports broadcasters, OTT platforms, leagues, teams, rights
  holders, news and entertainment. Magnifi publishes a partner REST API covering stream ingestion,
  clip / highlight / highlight-clip retrieval, match-video export, roster (tournament, team, player)
  and match-schedule management, entity membership, and HMAC-signed webhook event delivery. The
  company also ships an Adobe Premiere Pro extension and product lines including Digital Highlight
  Pro, Logo Detection, Content Moderation Pro, Auto Flip, Web Stories and Reely. VideoVerse was
  acquired by Minute Media in August 2025.
