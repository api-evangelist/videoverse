apis:
- name: Magnifi Partner Integration API
  description: >-
    Partner REST API for Magnifi by VideoVerse. Partners authenticate with an Access Key and Access
    Secret pair (x-access-key / x-access-secret headers) and use the API to ingest live or recorded
    streams (HLS, RTMP, SRT, MP4), read the AI-generated clips, highlights and highlight clips
    produced from them, export match videos, manage tournament / team / player rosters and match
    schedules, fetch pre-signed content URLs, manage entity members, and subscribe to change
    notifications over webhooks. The base URL is issued to each partner with their credentials and
    is not published, so the contract carries it as the templated server {PARTNER_BASE_URL}.
  humanURL: https://docs.prod.videoverse.dev/
