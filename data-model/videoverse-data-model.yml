source: openapi/videoverse-magnifi-partner-openapi.yml (itself derived from the provider Postman collection)
  + https://docs.prod.videoverse.dev/
api: Magnifi Partner Integration API
note: Entities and relationships are read from the published request bodies, response examples, sub-resource
  paths and error-code semantics. Nothing is inferred beyond what one of those states. Magnifi publishes
  no schema documents, so field-level types come from its own examples.
root_scope: entityId — the documentation states that all resources and content are associated with the
  entity (organization or workspace) the access key belongs to.
entity_count: 19
relationship_count: 24
entities:
- name: Entity
  description: A partner organization or workspace. Every resource and every piece of content belongs
    to exactly one entity. entityType is "organization" or "workspace".
  identifier: entityId (ws_… for a workspace, org_… for an organization)
  operations:
  - getPartnerDetails
  - getPartnerWorkspaces
- name: User
  description: A person inside an entity, carrying a role (admin, user).
  identifier: userId
  operations:
  - getPartnerDetails
  - getAssignableUsers
- name: EntityMember
  description: The membership record binding a user to an entity with a role.
  identifier: entityMemberId (orgMem_… / wsMem_…)
  operations:
  - createEntityMember
  - getEntityMembers
  - assignRoleToUser
  - updateEntityMemberRole
  - removeEntityMember
- name: Category
  description: A sport or content classification the entity is entitled to (cricket, football, basketball,
    …). The primary classification for most content.
  identifier: id
  operations:
  - getPartnerCategories
- name: Template
  description: 'A pre-configured video template required for stream ingestion. Grouped by channel type:
    direct, medialive, reserved_channel.'
  identifier: id / templateName
  operations:
  - getPartnerTemplates
  - getPartnerTemplateAudioOptions
- name: StorageBucket
  description: A partner-configured destination bucket for delivered content.
  identifier: id
  operations:
  - getPartnerStorageBuckets
- name: Language
  description: A language available for captions and audio options, identified by an ISO 639 three-letter
    code.
  identifier: code
  operations:
  - getPartnerLanguages
- name: Stream
  description: A live or recorded video feed ingested into Magnifi. All AI-generated content descends
    from a stream. Carries status, fireAt, aspectRatio, partner custom fields and an optional publishingWebhookUrl.
  identifier: streamId
  operations:
  - createStream
  - getAllStreams
  - getStreamByStreamId
  - updateStreamByStreamId
  - getFiltersByStreamId
- name: Clip
  description: A short video capturing a key moment, generated from a stream. Carries startTime, endTime,
    duration, players, outcome, rating, transcript and video/thumbnail URLs.
  identifier: clipId
  operations:
  - getByClipId
  - getClipsByStreamId
- name: Highlight
  description: A dynamic compilation of clips assembled from business rules the partner sets.
  identifier: highlightId
  operations:
  - getHighlightByHighlightId
  - getHighlightsByStreamId
- name: HighlightClip
  description: The finalized, rendered version of a highlight, ready for partner use.
  identifier: hlClipId
  operations:
  - getHlClipByHlclipId
  - getHlClipsByStreamId
- name: MatchVideo
  description: An exported video derived from a stream (e.g. partial-video), with a processing status
    and progress.
  identifier: matchVideoId
  operations:
  - getMatchVideoByMatchVideoId
  - getAllMatchVideos
  - getMatchVideosByStreamId
- name: CatchMeUpHighlight
  description: A generated catch-up highlight for a stream, produced against a catch-me-up config and
    returning clips with pre-signed URLs.
  identifier: id (cmu_hl_…), configId (cmu_cfg_…)
  operations:
  - getCatchMeUpHighlight
- name: Player
  description: A roster player, with a category and free-form metadata (jersey number, nickname).
  identifier: id
  operations:
  - addPlayer
  - getAllPlayers
  - getPlayerByPlayerId
  - updatePlayerByPlayerId
- name: Team
  description: A roster team holding players, with a category and free-form metadata (short name).
  identifier: teamId / id
  operations:
  - addTeam
  - getAllTeams
  - getTeamByTeamId
  - updateTeamByTeamId
- name: Tournament
  description: A competition holding teams, with a category and free-form metadata (sponsor).
  identifier: id
  operations:
  - addTournament
  - getAllTournaments
  - getTournamentByTournamentId
  - updateTournamentByTournamentId
- name: MatchSchedule
  description: A scheduled fixture that can be linked to a stream. Carries matchStartTime, timezone, venue,
    HOME/AWAY teams, a tournament and an external match id.
  identifier: id (msh_…), extMatchId (ext_match_…)
  operations:
  - createMatchSchedule
  - getAllMatchSchedules
  - getMatchScheduleByMatchScheduleId
  - updateMatchScheduleByMatchScheduleId
  - deleteMatchScheduleByMatchScheduleId
  - deLinkByMatchScheduleId
  - invokeStreamByMatchScheduleId
- name: NotifierSubscription
  description: A webhook subscription to change events on a resource type, scoped to operations and fields,
    with isActive and failureCount.
  identifier: subscriptionId (sub_ntf_…)
  operations:
  - createSubscription
  - getSubscriptions
  - getSubscriptionBySubscriptionId
  - updateSubscription
  - deleteSubscription
- name: NotifierTopic
  description: The catalogue of subscribable resource types with their available operations, standard
    fields and category-scoped custom fields.
  identifier: resourceType
  operations:
  - fetchTopics
