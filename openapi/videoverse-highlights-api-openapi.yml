    get:
      operationId: getHighlightByHighlightId
      summary: Get Highlight by highlightId
      tags:
      - Highlights
      description: 'Retrieves the metadata of a specific highlight.

        Params:


        HIGHLIGHT_ID (URL param): Specifies the unique identifier of the highlight.'
      parameters:
      - name: highlightId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      version:
                        type: integer
                      metadata:
                        type: object
                        properties:
