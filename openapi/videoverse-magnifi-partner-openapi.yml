        page (number, required): The page number to retrieve.


        pageSize (number, required): The number of items per page.


        events (string, optional): Filters clips by associated events. For multiple events, separate them
        with commas (e.g., four,out).


        players (string, optional): Filters clips by associated player name. For multiple players, separate
        them with commas (e.g., ronaldo,messi).


        search (string, optional): Searches for clips by title.


        filters (object, optional): Allows filtering based on clip-level custom fields.  Pass key–value
        pairs where the key is the custom field name and the value is the filter value.  e.g. filters={"cameraAngle":"side"}


        sort (object, optional): Allows you to sort clips by createdAt.  By default the sort order is
        -1 (newest) but you can pass 1 for (oldest).  e.g. sort={"createdAt" : 1}'
      parameters:
      - name: streamId
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
