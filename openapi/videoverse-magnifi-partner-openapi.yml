  /v1/stream:
    post:
      operationId: createStream
      summary: Create stream
      tags:
      - Streams
      description: "Create a new stream with the specified details.\nRequest Body:\n\ntitle (string, required):\
        \ The title of the stream.\n\nurl (string, required): The URL of the stream.\n\ncategory (string,\
        \ required): The category of the stream.\n\nfireAt (string, required): The timestamp at which\
        \ the stream should start.\n\nstreamStartTime (string, optional): The start time of the stream.\n\
        \nfields (object, required): Additional fields for the stream.\n\next_stream_id (string, optional):\
        \ The external stream ID.\n\n\ntemplateName (string, required): The name of the template.\n\n\
        publishingWebhookUrl (string, optional): Webhook URL where you want us to send metadata.\n\nhls_live_start_index\
        \ (number, optional): Default value 1\n\ntournamentId (string, optional): ID for the tournament\
        \ to which the stream belongs.\n\nhomeTeamId (string, optional): ID for the home team participating\
        \ in the stream.\n\nawayTeamId (string, optional): ID for the away team participating in the stream.\n\
        \nmatchScheduleId (string, optional): ID for the scheduled match linked to the stream. ( e.g:\
        \ msh_54e6c315-f73a-4a77-b7c6-9940ff547123 )\n\nshareType (enum, optional): Use this field to\
        \ specify how the stream should be shared with workspaces. Note that the sharedWith field must\
        \ also be provided for this to take effect. Accepted enum values:\n\noriginal – The stream scope\
        \ is shared, allowing generated clips to be accessible in both the parent organization and the\
        \ shared workspace.\n\nclone – The shared workspace can view clips generated in the parent organization,\
        \ but the parent organization will not see clips created in the shared workspace.\n\n\n\nsharedWith\
        \ (string[], optional): A list of workspace IDs where the stream should be shared.\n\nstreamLanguage\
        \ (string, optional): Default language for the stream (e.g: \"en\").\n\nstorageId (string, optional):\
        \ Storage target ID for outputs.  clipNamingTemplateId (string, optional): Template ID for naming\
        \ generated clips.\n\naudioType (string, optional): How audio is selected for multi-audio streams.\
        \ Accepted values: iso, track, pid. When iso, scte35Source is required.\n\nscte35Source (string,\
        \ optional): Where SCTE-35 cues are read from. Required when audioType is \"iso\". Accepted values:\
        \ SEGMENTS, MANIFESTS. Optional otherwise.\n\naudioLanguages (string[], optional): Language codes\
        \ for audio tracks (e.g: [\"en\", \"es\"]).\n\nclipLanguages (string[], optional): Language codes\
        \ for clip generation (e.g: [\"en\", \"es\"]).\n\naudioTracks (string[], optional): HLS audio\
        \ group or track IDs (e.g: [\"aud1\", \"aud2\"]). Use when audioType is \"track\".\n\npids (string[],\
