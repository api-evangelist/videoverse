        Query Params:


        page (number, required): The page number to retrieve.


        pageSize (number, required): The number of items per page.


        filters (object, optional): Allows filtering based on hlclip-level custom fields.  Pass key–value
        pairs where the key is the custom field name and the value is the filter value.  e.g. filters={"hl_type":"1st
        Inning"}'
