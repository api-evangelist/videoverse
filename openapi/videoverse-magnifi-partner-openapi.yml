  /v1/match-schedule/{matchScheduleId}/invoke-stream:
    post:
      operationId: invokeStreamByMatchScheduleId
      summary: Invoke stream by matchScheduleId
      tags:
      - Match Schedule
      description: "Create a new stream from the match schedule.\nParams:\n\nMATCH_SCHEDULE_ID (URL param):\
        \ Specifies the unique identifier of the match schedule.\n\nRequest Body:\n\ntemplateName (string,\
        \ required): The name of the template.\n\ntitle (string, optional): The title of the stream.\n\
        \nurl (string, optional): The URL of the stream.\n\ncategory (string, optional): The category\
        \ of the stream.\n\nfireAt (string, optional): The timestamp at which the stream should start.\n\
        \nstreamStartTime (string, optional): The start time of the stream.\n\nfields (object, optional):\
        \ Additional fields for the stream.\n\next_stream_id (string, optional): The external stream ID.\n\
        \n\npublishingWebhookUrl (string, optional): Webhook URL where you want us to send metadata.\n\
        \nhls_live_start_index (number, optional): Default value 1\n\ntournamentId (string, optional):\
        \ ID for the tournament to which the stream belongs.\n\nhomeTeamId (string, optional): ID for\
        \ the home team participating in the stream.\n\nawayTeamId (string, optional): ID for the away\
        \ team participating in the stream.\n\nshareType (enum, optional): Use this field to specify how\
        \ the stream should be shared with workspaces. Note that the sharedWith field must also be provided\
        \ for this to take effect. Accepted enum values:\n\noriginal – The stream scope is shared, allowing\
        \ generated clips to be accessible in both the parent organization and the shared workspace.\n\
        \nclone – The shared workspace can view clips generated in the parent organization, but the parent\
        \ organization will not see clips created in the shared workspace.\n\n\n\nsharedWith (string[],\
        \ optional): A list of workspace IDs where the stream should be shared.\n\nstreamLanguage (string,\
        \ optional): Default language for the stream (e.g: \"en\").\n\nstorageId (string, optional): Storage\
        \ target ID for outputs.  clipNamingTemplateId (string, optional): Template ID for naming generated\
        \ clips.\n\naudioType (string, optional): How audio is selected for multi-audio streams. Accepted\
        \ values: iso, track, pid. When iso, scte35Source is required.\n\nscte35Source (string, optional):\
        \ Where SCTE-35 cues are read from. Required when audioType is \"iso\". Accepted values: SEGMENTS,\
        \ MANIFESTS. Optional otherwise.\n\naudioLanguages (string[], optional): Language codes for audio\
        \ tracks (e.g: [\"en\", \"es\"]).\n\nclipLanguages (string[], optional): Language codes for clip\
        \ generation (e.g: [\"en\", \"es\"]).\n\naudioTracks (string[], optional): HLS audio group or\
        \ track IDs (e.g: [\"aud1\", \"aud2\"]). Use when audioType is \"track\".\n\npids (string[], optional):\
        \ MPEG-TS audio PIDs (e.g: [\"257\", \"258\"]). Use when audioType is \"pid\".\n\nautoAspectRatioConvert\
        \ (object, optional): Auto aspect-ratio conversion. e.g: { \"autoConvertAspectRatios\": [\"16:9\"\
        ] }.\n\n\nNote:All optional fields will automatically fall back to the corresponding values from\
        \ the match schedule, if available. If any optional field is not provided explicitly in the request\
        \ body, the system will use the default value from the associated match schedule.\nThe fields\
        \ object is flexible, allowing you to pass any custom information needed when retrieving metadata.\n\
        If datafeed access is required, please reach out to us to enable it. Once access is granted, include\
        \ the following within the payload object:\n\"datafeed\": {\n    \"type\": \"genius\",\n    \"\
        competitionId\": \"some_id\",\n    \"tournamentId\": \"some_id\",\n    \"matchId\": \"some_id\"\
        \n}"
      parameters:
      - name: matchScheduleId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateName:
                  type: string
                url:
                  type: string
                homeTeamId:
                  type: string
                awayTeamId:
                  type: string
                title:
                  type: string
                fireAt:
                  type: string
                  format: date-time
            example:
              templateName: Test mp4 template
              url: https://d1rkuvpc8sfd7al.cloudfront.net/example/master_highest.m3u8
              homeTeamId: EzuBP0123
              awayTeamId: 8pAIPh321
              title: new title
              fireAt: '2025-11-10T09:30:30.293Z'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      stream:
                        type: object
                        properties:
                          streamId:
                            type: string
                          title:
                            type: string
                          url:
                            type: string
                          category:
                            type: string
                          userId:
                            type: string
                          entityId:
                            type: string
                          fireAt:
                            type: string
                          aspectRatio:
                            type: string
                          status:
                            type: string
                          streamStartTime:
                            type: string
                            format: date-time
                          fields:
                            type: object
                            properties:
                              tournamentId:
                                type: string
                              team1Id:
                                type: 'null'
                              team2Id:
                                type: 'null'
                              stream_start_time:
                                type: string
                          match_start_time_on_server:
                            type: integer
                          templateId:
                            type: string
                          hls_live_start_index:
                            type: integer
                          publishingWebhookUrl:
                            type: string
                          createdAt:
                            type: string
                            format: date-time
