openapi: 3.2.0
info:
  title: Magnifi Partner Integration Match Schedule API
  version: v1
  summary: Partner API for Magnifi by VideoVerse — stream ingestion, AI clip and highlight retrieval, roster and match-schedule management, and webhook subscriptions.
  description: Magnifi offers a comprehensive suite of API endpoints designed for seamless integration, enabling partners to access platform resources, content, and metadata efficiently.
  contact:
    name: Magnifi by VideoVerse
    url: https://magnifi.ai/contact-us
  termsOfService: https://magnifi.ai/terms-conditions
servers:
- url: '{PARTNER_BASE_URL}'
  description: Templated. Magnifi publishes its partner API base only as the Postman variable {{PARTNER_BASE_URL}}; the concrete host is issued to each partner alongside the Access Key and Access Secret and is not stated in the public documentation.
  variables:
    PARTNER_BASE_URL:
      default: '{PARTNER_BASE_URL}'
      description: Partner-specific API base URL issued by Magnifi.
security:
- AccessKey: []
  AccessSecret: []
tags:
- name: Match Schedule
paths:
  /v1/match-schedule:
    post:
      operationId: createMatchSchedule
      summary: Create match schedule
      tags:
      - Match Schedule
      description: 'Create a new match schedule with the specified details.

        Request Body:


        name (string, required): The name of the match.


        matchStartTime (string, required): The timestamp at which the match is scheduled to start, in ISO 8601 format.


        timezone (string, required): The timezone for the match start time, e.g., ''Etc/UTC''.


        teams (array, optional): An array of objects representing the teams in the match.


        teamId (string, required): The unique identifier of the team.


        type (string, required): The role of the team in the match, e.g., ''HOME'' or ''AWAY''.


        tournament (string, optional): The unique identifier of the tournament to which the match belongs.


        category (string, required): The category of the match, e.g., ''cricket''.


        extMatchId (string, optional): An optional external match ID.slug (string, optional):An optional slug for the match.


        slug (string, optional): An optional slug for the match.


        streamUrl (string, optional): The URL for the match stream.


        venue (string, optional): The venue where the match is taking place.


        streamCustomFields (object, optional): A set of custom key-value pairs defining additional stream-specific fields for the match.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                matchStartTime:
                  type: string
                timezone:
                  type: string
                teams:
                  type: array
                  items:
                    type: object
                    properties:
                      teamId:
                        type: string
                      type:
                        type: string
                tournament:
                  type: string
                category:
                  type: string
            example:
              name: Example Match
              matchStartTime: '2024-11-15T23:30:00'
              timezone: Etc/UTC
              teams:
              - teamId: EzuBP0z12
                type: HOME
              - teamId: 8pAIPh9.y
                type: AWAY
              tournament: KQerB10o3
              category: cricket
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      extMatchId:
                        type: string
                      organizationId:
                        type: string
                      workspaceWithAccess:
                        type: 'null'
                      category:
                        type: string
                      matchStartTime:
                        type: string
                        format: date-time
                      tournament:
                        type: string
                      teams:
                        type: array
                        items:
                          type: object
                          properties:
                            teamId:
                              type: string
                            type:
                              type: string
                      venue:
                        type: 'null'
                      streamId:
                        type: 'null'
                      streamUrl:
                        type: 'null'
                      metaData:
                        type: object
                        properties:
                          originalMatchStartTime:
                            type: object
                            properties:
                              matchStartTime:
                                type: string
                              timezone:
                                type: string
              examples:
                createMatchScheduleSuccess:
                  value:
                    statusCode: 201
                    message: Match schedule added successfully
                    data:
                      id: msh_d16c0fa1-6db8-4160-b486-b431130e6231
                      name: Example Match
                      extMatchId: ext_match_bbefc35b-8ea6-4744-b196-505cd431010d
                      organizationId: org_b7335033-a5fb-4815-b0f5-5ad801dde5ef
                      workspaceWithAccess: null
                      category: cricket
                      matchStartTime: '2024-11-16T07:30:00.000Z'
                      tournament: KQerB10o3
                      teams:
                      - teamId: hCOte-L.1
                        type: HOME
                      - teamId: hCOte-L.2
                        type: AWAY
                      venue: null
                      streamId: null
                      streamUrl: null
                      metaData:
                        originalMatchStartTime:
                          matchStartTime: '2024-11-15T23:30:00'
                          timezone: Etc/UTC
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      code:
                        type: string
                      metadata:
                        type: object
                        properties:
                          errorMetadata:
                            type: string
              examples:
                createMatchScheduleIncorrectTournamentID:
                  value:
                    statusCode: 400
                    error:
                      message: Tournament ID is incorrect
                      code: MS003
                      metadata:
                        errorMetadata: Tournament with ID 6PHBy0V12 not found
                createMatchScheduleTournamentCategoryMismatch:
                  value:
                    statusCode: 400
                    error:
                      message: Tournament category mismatch
                      code: MS005
                      metadata:
                        errorMetadata: Tournament category football does not match with the given category
                createMatchScheduleIncorrectCategory:
                  value:
                    statusCode: 400
                    error:
                      message: Category is incorrect
                      code: MS004
                      metadata:
                        errorMetadata: Category with name shooting not found for entity org_b7335033-a5fb-4815-b0f5-5ad801dde5ef
                createMatchScheduleIncorrectTeamID:
                  value:
                    statusCode: 400
                    error:
                      message: Team ID is incorrect
                      code: MS002
                      metadata:
                        errorMetadata: Team with ID GUwQObsk77 not found
                createMatchScheduleTeamNotInTournament:
                  value:
                    statusCode: 400
                    error:
                      message: Team not in tournament
                      code: MS006
                      metadata:
                        errorMetadata: Team with ID A5Ad3-ojA not found in tournament
        '401':
          description: Unauthorized — invalid or missing x-access-key / x-access-secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        default:
          description: Error response carrying a Magnifi error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
