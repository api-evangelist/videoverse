  /v1/partner/getPreSignedUrl:
    post:
      operationId: generatePreSignedUrl
      summary: Generate Pre-signed Url (to be deprecated)
      tags:
      - Partner
      description: 'Allows partners to obtain a pre-signed URL for a specific clip or highlight.

        Request Body


        id (string) - The unique identifier of the video.


        videoType (string) - The type of video can be either "CLIP" or "HIGHLIGHT" or "HLCLIP".


        Marked "[TO BE DEPRECATED]" in the provider''s own Postman collection. Use POST /v1/content/presigned-url (fetchPresignedUrl) instead.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: "{\n    \"id\": \"66c2e22fecfcc10006fb4cfd\",\n    \"videoType\": \"CLIP\" // or \"HIGHLIGHT\" or \"HLCLIP\"\n}"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: string
              examples:
                generatePreSignedUrlClip:
                  value:
                    statusCode: 200
                    message: Pre-signed URL generated successfully.
                    data: https://example.amazonaws.com/an34njr/7BH9147895_2169.mp4
                generatePreSignedUrlHighlight:
                  value:
                    statusCode: 200
                    message: Pre-signed URL generated successfully.
                    data: https://example.amazonaws.com/4e24-4999-1234-f6143d8d706a.mp4
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      code:
                        type: string
                      metadata:
                        type: object
                        properties:
                          errorMetadata:
                            type: string
              examples:
                generatePreSignedUrlClipIdNotFound:
                  value:
                    statusCode: 404
                    error:
                      message: Clip data not found
                      code: C001
                      metadata:
                        errorMetadata: Clip with ID 66b2f3b2b123c9198769fade not found
                generatePreSignedUrlEntityMismatch:
                  value:
                    statusCode: 404
                    error:
                      message: 'Permission denied: Entity mismatch'
                      code: P001
                      metadata:
                        errorMetadata: 'Permission denied: Entity mismatch'
        '401':
          description: Unauthorized — invalid or missing x-access-key / x-access-secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        default:
          description: Error response carrying a Magnifi error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: true
components:
  schemas:
    Error:
      type: object
      description: Magnifi error envelope. `error.code` is a Magnifi error code (see errors/videoverse-problem-types.yml).
      properties:
        statusCode:
          type: integer
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
            metadata:
              type: object
      example:
        statusCode: 404
        error:
          message: Clip data not found
          code: C001
          metadata: {}
    AuthError:
      type: object
      description: Returned when the access key or secret is missing or invalid.
      properties:
        message:
          type: string
        error:
          type: string
        statusCode:
          type: integer
      example:
        message: Invalid access key or access secret
        error: Unauthorized
        statusCode: 401
  securitySchemes:
    AccessKey:
      type: apiKey
      in: header
      name: x-access-key
      description: 'Partner Access Key issued by Magnifi. Documented example prefix: pak_.'
    AccessSecret:
      type: apiKey
      in: header
      name: x-access-secret
      description: Partner Access Secret issued by Magnifi. Sent on every request alongside x-access-key.
