openapi: 3.2.0
info:
  title: Magnifi Integration Partner API
  version: v1
  summary: Partner API for Magnifi by VideoVerse — stream ingestion, AI clip and highlight retrieval, roster and match-schedule management, and webhook subscriptions.
  description: Magnifi offers a comprehensive suite of API endpoints designed for seamless integration, enabling partners to access platform resources, content, and metadata efficiently.
  contact:
    name: Magnifi by VideoVerse
    url: https://magnifi.ai/contact-us
  termsOfService: https://magnifi.ai/terms-conditions
servers:
- url: '{PARTNER_BASE_URL}'
  description: Templated. Magnifi publishes its partner API base only as the Postman variable {{PARTNER_BASE_URL}}; the concrete host is issued to each partner alongside the Access Key and Access Secret and is not stated in the public documentation.
  variables:
    PARTNER_BASE_URL:
      default: '{PARTNER_BASE_URL}'
      description: Partner-specific API base URL issued by Magnifi.
security:
- AccessKey: []
  AccessSecret: []
tags:
- name: Partner
paths:
  /v1/partner/details:
    get:
      operationId: getPartnerDetails
      summary: Get Partner Details
      tags:
      - Partner
      description: Retrieve details of the partner based on their access key.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          userId:
                            type: string
                          userEmail:
                            type: string
                          userName:
                            type: string
                          role:
                            type: string
                          organizationMemberId:
                            type: string
                      entity:
                        type: object
                        properties:
                          entityId:
                            type: string
                          entityType:
                            type: string
                          name:
                            type: string
              examples:
                getPartnerDetails:
                  value:
                    statusCode: 200
                    message: Partner details retrieved successfully
                    data:
                      user:
                        userId: exampleId
                        userEmail: example@magnifi.ai
                        userName: Example
                        role: admin
                        organizationMemberId: wsMem_1a2f40cc-4ee6-626b-bf13-c3m54qsaee93
                      entity:
                        entityId: ws_basd5033-a5xcb-6715-b0hj5-5aasdde5ef
                        entityType: workspace
                        name: Example Org
        '401':
          description: Unauthorized — invalid or missing x-access-key / x-access-secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        default:
          description: Error response carrying a Magnifi error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/partner/categories:
    get:
      operationId: getPartnerCategories
      summary: Get Partner Categories
      tags:
      - Partner
      description: 'Retrieves a list of categories allotted to partners to create a stream.

        Query Params:


        page (number, required): The page number to retrieve.


        pageSize (number, required): The number of items per page.'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        example: '1'
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
        example: '10'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                      currentPage:
                        type: integer
                      pageSize:
                        type: integer
                      totalItems:
                        type: integer
                      totalPages:
                        type: integer
              examples:
                getPartnerCategories:
                  value:
                    statusCode: 200
                    message: Partner categories retrieved successfully
                    data:
                      categories:
                      - id: 665578026232236ef5c4c059
                        name: basketball
                      - id: 665578026232236ef5c4c058
                        name: archery
                      - id: 665578026232236ef5c4c057
                        name: artistic_swimming
                      - id: 665578026232236ef5c4c056
                        name: athletics
                      - id: 665578026232236ef5c4c055
                        name: Badminton
                      - id: 665578026232236ef5c4c054
                        name: beach_volleyball
                      - id: 665578026232236ef5c4c0510
                        name: boxing
                      - id: 665578026232236ef5c4c051
                        name: canoe_slalom
                      - id: 665578026232236ef5c4c052
                        name: cycling_mounain_bike
                      - id: 665578026232236ef5c4c053
                        name: cycling_track
                      currentPage: 1
                      pageSize: 10
                      totalItems: 34
                      totalPages: 4
        '401':
          description: Unauthorized — invalid or missing x-access-key / x-access-secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        default:
          description: Error response carrying a Magnifi error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/partner/templates:
    get:
      operationId: getPartnerTemplates
      summary: Get Partner Templates
      tags:
      - Partner
      description: Retrieve templates allotted to partners to create a stream efficiently.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      direct:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            templateName:
                              type: string
                      medialive:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            templateName:
                              type: string
                      reserved_channel:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            templateName:
                              type: string
              examples:
                getPartnerTemplates:
                  value:
                    statusCode: 200
                    message: Partner templates retrieved successfully
                    data:
                      direct:
                      - id: 66bc71fgh3052d000718xcaa
                        templateName: Example Direct Template
                      medialive:
                      - id: 66bc71fgh3052d000718xcbb
                        templateName: Example Media Template
                      reserved_channel:
                      - id: 66bc71fgh3052d000718xcacc
                        templateName: Example Reserved Channel
        '401':
          description: Unauthorized — invalid or missing x-access-key / x-access-secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        default:
          description: Error response carrying a Magnifi error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/partner/workspaces:
    get:
      operationId: getPartnerWorkspaces
      summary: Get Partner Workspaces
      tags:
      - Partner
      description: fetch a list of workspaces associated with the partner account.
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      workspaces:
                        type: array
                        items:
                          type: object
                          properties:
                            workspaceId:
                              type: string
                            workspaceName:
                              type: string
              examples:
                getPartnerWorkspaces:
                  value:
                    statusCode: 200
                    message: Partner workspaces retrieved successfully
                    data:
                      workspaces:
                      - workspaceId: ws_some_random_uuid1
                        workspaceName: ws1
                      - workspaceId: ws_some_random_uuid2
                        workspaceName: ws2
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      code:
                        type: string
                      metadata:
                        type: object
              examples:
                getPartnerWorkspacesError:
                  value:
                    statusCode: 404
                    error:
                      message: Workspace user can not fetch other workspace's data
                      code: WS001
                      metadata: {}
        '401':
          description: Unauthorized — invalid or missing x-access-key / x-access-secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        default:
          description: Error response carrying a Magnifi error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/partner/stream-fields:
    get:
      operationId: getPartnerStreamCustomFields
      summary: Get Partner Stream Custom Fields
      tags:
      - Partner
      description: 'Retrieves a list of stream fields allotted to partners to create a stream/match schedule.

        Query Params:


        category (string, required): The category for which to retrieve the allotted fields.'
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
        example: cricket
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            category:
                              type: string
                            fieldName:
                              type: string
                            displayName:
                              type: string
                            required:
                              type: boolean
                            inputType:
                              type: string
                            allowedValues:
                              type: array
                              items:
                                type: string
              examples:
                getPartnerCustomFields:
                  value:
                    statusCode: 200
                    message: Partner custom fields retrieved successfully
                    data:
                      fields:
                      - category: all
                        fieldName: abcd
                        displayName: abcd
                        required: true
                        inputType: SELECT
                        allowedValues:
                        - a
                        - b
                        - c
                      - category: all
                        fieldName: round
                        displayName: Round
                        required: false
                        inputType: TEXT
                        allowedValues: Any string
                      - category: all
                        fieldName: boolean_test
                        displayName: boolean test
                        required: false
                        inputType: BOOLEAN
                        allowedValues:
                        - true
                        - false
                      - category: all
                        fieldName: test_input_masking
                        displayName: test input masking
                        required: true
                        inputType: INPUT_MASKING
                        allowedValues: '9999-99-99'
                      - category: cricket
                        fieldName: over
                        displayName: over
                        required: false
                        inputType: TEXT
                        allowedValues: Any string
        '401':
          description: Unauthorized — invalid or missing x-access-key / x-access-secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        default:
          description: Error response carrying a Magnifi error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/partner/clip-naming-templates:
    get:
      operationId: getPartnerClipNamingTemplates
      summary: Get Partner Clip Naming Templates
      tags:
      - Partner
      description: Retrieves a list of clip naming templates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      templates:
                        type: array
                        items:
                          type: object
                          properties:
                            clipNamingTemplateId:
                              type: string
                            format:
                              type: string
                            templateName:
                              type: string
                            category:
                              type: string
                            isActive:
                              type: boolean
                            keys:
                              type: array
                              items:
                                type: string
                      currentPage:
                        type: integer
                      pageSize:
                        type: integer
                      totalItems:
                        type: integer
                      totalPages:
                        type: integer
              examples:
                getPartnerClipNamingTemplates:
                  value:
                    statusCode: 200
                    message: Partner clip naming templates retrieved successfully
                    data:
                      templates:
                      - clipNamingTemplateId: b170342f-957b-454d-b4bf-26774c0482a1
                        format: '{{#if (ne outcome "failed")}}Still going strong!{{/if}}'
                        templateName: example-not-equal-template
                        category: cricket
                        isActive: false
                        keys:
                        - outcome
                      - clipNamingTemplateId: 66df134f-84c4-4fcc-b285-9dc6f3d615fb
                        format: '{{#if (lt clipRating 3)}}Low Rating{{/if}}'
                        templateName: example-rating-template
                        category: cricket
                        isActive: false
                        keys:
                        - clipRating
                      - clipNamingTemplateId: 6dab8e59-b6a8-42ff-9261-7b55139fec18
                        format: '{{aspectRatio}}_{{team1}}_{{team2}}_{{tournament}}'
                        templateName: sample-generic-template
                        category: football
                        isActive: true
                        keys:
                        - aspectRatio
                        - team1
                        - team2
                        - tournament
                      currentPage: 1
                      pageSize: 10
                      totalItems: 3
                      totalPages: 1
        '401':
          description: Unauthorized — invalid or missing x-access-key / x-access-secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        default:
          description: Error response carrying a Magnifi error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
