  /v1/partner/team/{teamId}:
    put:
      operationId: updateTeamByTeamId
      summary: Update team by teamId
      tags:
      - Team
      description: 'Allows you to update a team in Partner''s organization.

        Params:


        TEAM_ID (URL param): Specifies the unique identifier of the TEAM.(short, unique ID)


        Example: TEAM_ID: hCOte-L.1


        Request Body:


        category (string, required): The category of the team.


        teamName (string, required): The name of the team.


        players (array, required): An array of players id .


        metaData (object, required): Additional metadata for the team.


        shortName (string): The short name of the team.


        The metaData object is flexible, allowing you to pass any custom information needed when retrieving clip metadata.'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                teamName:
                  type: string
                players:
                  type: array
                  items:
                    type: string
                metaData:
                  type: object
                  properties:
                    shortName:
                      type: string
            example:
              category: cricket
              teamName: England
              players:
              - 59accd29-067a-435a-abcd-caf6b6f83123
              metaData:
                shortName: Eng
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      category:
                        type: string
                      players:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            metadata:
                              type: object
                              properties:
                                jerseyNumber:
                                  type: integer
                      metadata:
                        type: object
                        properties:
                          shortName:
                            type: string
                      teamId:
                        type: string
              examples:
                updateTeamByTeamId:
                  value:
                    statusCode: 200
                    message: Team data updated successfully
                    data:
                      id: 66cd9a071fb5d43575b2d123
                      name: England
                      category: cricket
                      players:
                      - id: 59accd29-067a-435a-abcd-caf6b6f83123
                        name: Morgan
                        metadata:
                          jerseyNumber: 93
                      metadata:
                        shortName: Eng
                      teamId: hynSs130W
