                          name: Lionel Messi
                          metadata:
                            jerseyNumber: 11
                            shortName: LM
                        metadata:
                          shortName: PTL
                        teamId: hCOte-L.1
                      - id: 66cd9a071fb4d43575b2d999
                        name: India 2024
