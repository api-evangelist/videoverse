openapi: 3.2.0
info:
  title: Magnifi Partner Integration Team API
  version: v1
  summary: Partner API for Magnifi by VideoVerse — stream ingestion, AI clip and highlight retrieval, roster and match-schedule management, and webhook subscriptions.
  description: Magnifi offers a comprehensive suite of API endpoints designed for seamless integration, enabling partners to access platform resources, content, and metadata efficiently.
  contact:
    name: Magnifi by VideoVerse
    url: https://magnifi.ai/contact-us
  termsOfService: https://magnifi.ai/terms-conditions
servers:
- url: '{PARTNER_BASE_URL}'
  description: Templated. Magnifi publishes its partner API base only as the Postman variable {{PARTNER_BASE_URL}}; the concrete host is issued to each partner alongside the Access Key and Access Secret and is not stated in the public documentation.
  variables:
    PARTNER_BASE_URL:
      default: '{PARTNER_BASE_URL}'
      description: Partner-specific API base URL issued by Magnifi.
security:
- AccessKey: []
  AccessSecret: []
tags:
- name: Team
paths:
  /v1/partner/team:
    post:
      operationId: addTeam
      summary: Add team
      tags:
      - Team
      description: 'Add a new team for a partner.

        Request Body:


        category (string, required): The category of the team.


        teamName (string, required): The name of the team.


        players (array, required): An array of players id .


        metaData (object, required): Additional metadata for the team.


        shortName (string): The short name of the team.


        The metaData object is flexible, allowing you to pass any custom information needed when retrieving clip metadata.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                teamName:
                  type: string
                players:
                  type: array
                  items:
                    type: string
                metaData:
                  type: object
                  properties:
                    shortName:
                      type: string
            example:
              category: cricket
              teamName: India 2024
              players:
              - 7a3f2d4e-6d68-47a7-b960-417220594eec
              - dfc88d2d-1a3b-4e5d-a640-5d25f8dd3b2f
              metaData:
                shortName: MI
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      category:
                        type: string
                      players:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            metadata:
                              type: object
                              properties:
                                id:
                                  type: string
                                jerseyNumber:
                                  type: integer
                                nickName:
                                  type: string
                      metadata:
                        type: object
                        properties:
                          shortName:
                            type: string
                      teamId:
                        type: string
              examples:
                addTeam:
                  value:
                    statusCode: 201
                    message: Team added successfully
                    data:
                      id: 66cd9a071fb5d43575b2d123
                      name: India 2024
                      category: cricket
                      players:
                      - id: 7a3f2d4e-6d68-47a7-b960-417220594123
                        name: Suryakumar Yadav
                        metadata:
                          id: s43rbbdf
                          jerseyNumber: 63
                          nickName: Sky
                      - id: dfc88d2d-1a3b-4e5d-1234-5d25f8dd3b2f
                        name: Rohit Sharma
                        metadata:
                          id: a34dsf
                          jerseyNumber: 45
                          nickName: Shana
                      metadata:
                        shortName: MI
                      teamId: hCOte-L.1
        '401':
          description: Unauthorized — invalid or missing x-access-key / x-access-secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        default:
          description: Error response carrying a Magnifi error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: getAllTeams
      summary: Get all teams
      tags:
      - Team
      description: 'Retrieves the list of teams associated with the partner.

        Query Params:


        page (number, required): The page number to retrieve.


        pageSize (number, required): The number of items per page.


        category (string, optional): Filter teams by specific category.


        search (string, optional): Search teams by name.


        filters (object, optional): Additional filter on team metadata, e.g., { "extId" : "12345" }.'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        example: '1'
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
        example: '3'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      teams:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            category:
                              type: string
                            players:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    type: string
                                  metadata:
                                    type: object
                                    properties:
                                      jerseyNumber: {}
                                      shortName: {}
                            metadata:
                              type: object
                              properties:
                                shortName:
                                  type: string
                            teamId:
                              type: string
                      currentPage:
                        type: integer
                      pageSize:
                        type: integer
                      totalItems:
                        type: integer
                      totalPages:
                        type: integer
              examples:
