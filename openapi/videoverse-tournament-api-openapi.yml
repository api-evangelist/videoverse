                      totalItems: 10
                      totalPages: 5
        '401':
          description: Unauthorized — invalid or missing x-access-key / x-access-secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        default:
          description: Error response carrying a Magnifi error code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/partner/tournament/{tournamentId}:
    put:
      operationId: updateTournamentByTournamentId
      summary: Update tournament by tournamentId
      tags:
      - Tournament
      description: 'Allows you to update a tournament in Partner''s organization.

        Params:


        TOURNAMEMT_ID (URL param): Specifies the unique identifier of the Tournament.


        Request Body:


        category (string, required): The category of the tournament.


        tournamentName (string, required): The name of the tournament.


        teams (array of strings, required): An array of teams id participating in the tournament. Note: This should be a short ID. (e.g., [ "bynSs130W" ])


        metaData (object, required): Additional metadata for the tournament.


        The metaData object is flexible, allowing you to pass any custom information needed when retrieving clip metadata.'
      parameters:
      - name: tournamentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                tournamentName:
                  type: string
                teams:
                  type: array
                  items:
                    type: string
                metaData:
                  type: object
                  properties:
                    sponsored:
                      type: string
            example:
              category: cricket
              tournamentName: ICC Worldcup 2023
              teams:
              - hynSs130W
              - Sw8LmzGRm
              metaData:
                sponsored: ICC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      category:
                        type: string
                      teams:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            players:
                              type: array
                              items:
                                type: object
                                properties:
